spring.application.name=calificaciones

# Base de datos embebida H2 en modo MySQL (no requiere instalar nada).
# Para usar MySQL real: ejecutar con --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/calificaciones;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
